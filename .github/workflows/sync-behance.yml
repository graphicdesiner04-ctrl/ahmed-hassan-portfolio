name: Sync Behance Projects

on:
  schedule:
    - cron: '0 6 * * *'   # Every day at 06:00 UTC (auto-update)
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Behance projects
        run: node fetch-behance.js
        env:
          BEHANCE_API_KEY: ${{ secrets.BEHANCE_API_KEY }}

      - name: Commit updated projects.js (if changed)
        run: |
          git config user.name  "Behance Auto-Sync"
          git config user.email "actions@github.com"
          git add projects.js
          git diff --staged --quiet || git commit -m "chore: sync Behance projects [$(date +'%Y-%m-%d')]"
          git push
