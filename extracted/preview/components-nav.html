<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 0; font-family: var(--font-family); margin: 0; }
  .section { padding: 20px 28px; border-bottom: 1px solid var(--color-border-light); }
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 14px; }

  /* Nav default */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 64px;
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
  }
  .nav-logo { font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-text-primary); }
  .nav-links { display: flex; gap: 36px; }
  .nav-link { font-size: 12px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; color: var(--color-text-secondary); cursor: pointer; }
  .nav-link.active { color: var(--color-text-primary); border-bottom: 1px solid var(--color-accent); padding-bottom: 2px; }
  .nav-cta { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-muted); cursor: pointer; }

  /* Nav frosted */
  .nav-frosted {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 64px;
    background: rgba(245,237,230,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(232,217,204,0.5);
  }

  /* Mobile nav */
  .nav-mobile {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 56px;
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
  }
  .hamburger { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
  .hamburger-line { width: 22px; height: 1px; background: var(--color-text-primary); }
</style>
</head>
<body>
  <div class="section">
    <div class="section-label">Default Navigation</div>
    <div class="nav">
      <div class="nav-logo">Ahmed Hassan</div>
      <div class="nav-links">
        <span class="nav-link active">Work</span>
        <span class="nav-link">About</span>
        <span class="nav-link">Contact</span>
      </div>
      <span class="nav-cta">Available for Freelance →</span>
    </div>
  </div>
  <div class="section">
    <div class="section-label">Frosted Glass (on scroll)</div>
    <div class="nav-frosted">
      <div class="nav-logo">Ahmed Hassan</div>
      <div class="nav-links">
        <span class="nav-link active">Work</span>
        <span class="nav-link">About</span>
        <span class="nav-link">Contact</span>
      </div>
      <span class="nav-cta">Available for Freelance →</span>
    </div>
  </div>
  <div class="section" style="border-bottom:none;">
    <div class="section-label">Mobile Navigation</div>
    <div class="nav-mobile" style="max-width:375px;">
      <div class="nav-logo">Ahmed Hassan</div>
      <div class="hamburger"><div class="hamburger-line"></div><div class="hamburger-line"></div></div>
    </div>
  </div>
</body>
</html>
