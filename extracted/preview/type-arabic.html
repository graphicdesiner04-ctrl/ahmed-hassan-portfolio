<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 28px 32px; font-family: var(--font-family); }
  .block { margin-bottom: 20px; border-bottom: 1px solid var(--color-border-light); padding-bottom: 20px; }
  .block:last-child { border-bottom: none; margin-bottom: 0; }
  .label-en { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 6px; direction: ltr; }
</style>
</head>
<body>
<div class="block">
  <div class="label-en">Display — 52px / 300</div>
  <div style="font-size:44px;font-weight:300;line-height:1.2;color:#3E2F28;direction:rtl;text-align:right;letter-spacing:0;">أحمد حسن</div>
</div>
<div class="block">
  <div class="label-en">H2 — 32px / 400</div>
  <div style="font-size:26px;font-weight:400;line-height:1.3;color:#3E2F28;direction:rtl;text-align:right;">أعمال مختارة</div>
</div>
<div class="block">
  <div class="label-en">Body — 15px / 400</div>
  <div style="font-size:15px;font-weight:400;line-height:1.8;color:#7A6155;direction:rtl;text-align:right;max-width:480px;margin-right:0;margin-left:auto;">مصمم بصري متخصص في الهوية التجارية وتصميم وسائل التواصل الاجتماعي والطباعة الفاخرة.</div>
</div>
<div class="block">
  <div class="label-en">Label — 11px / 500 uppercase</div>
  <div style="font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:#B0998F;direction:rtl;text-align:right;">تصميم الشعار · العلامة التجارية · طباعة</div>
</div>
</body>
</html>
