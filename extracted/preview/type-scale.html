<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 28px 32px; font-family: var(--font-family); }
  .specimen { display: flex; flex-direction: column; gap: 0; }
  .row { display: flex; align-items: baseline; gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--color-border-light); }
  .row:last-child { border-bottom: none; }
  .meta { min-width: 110px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; }
  .meta-name { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-muted); }
  .meta-size { font-size: 10px; color: var(--color-text-muted); font-family: monospace; }
  .sample { color: var(--color-text-primary); }
</style>
</head>
<body>
<div class="specimen">
  <div class="row">
    <div class="meta"><span class="meta-name">Display</span><span class="meta-size">96px / 300</span></div>
    <span class="sample" style="font-size:52px;font-weight:300;line-height:1.06;letter-spacing:-0.02em;">Craft</span>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-name">H1</span><span class="meta-size">72px / 300</span></div>
    <span class="sample" style="font-size:42px;font-weight:300;line-height:1.1;letter-spacing:-0.02em;">Visual Identity</span>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-name">H2</span><span class="meta-size">56px / 400</span></div>
    <span class="sample" style="font-size:34px;font-weight:400;line-height:1.22;letter-spacing:-0.01em;">Selected Works</span>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-name">H3</span><span class="meta-size">44px / 400</span></div>
    <span class="sample" style="font-size:26px;font-weight:400;line-height:1.22;">Zahra Jewels</span>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-name">H4</span><span class="meta-size">32px / 500</span></div>
    <span class="sample" style="font-size:20px;font-weight:500;line-height:1.3;">Brand Identity, 2024</span>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-name">Body</span><span class="meta-size">15px / 400</span></div>
    <span class="sample" style="font-size:15px;font-weight:400;line-height:1.7;color:#7A6155;">A premium portfolio of visual craft — branding, print, and social campaigns.</span>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-name">Label</span><span class="meta-size">11px / 500</span></div>
    <span class="sample" style="font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:#B0998F;">Social Media · Logo Design · Print</span>
  </div>
</div>
</body>
</html>
