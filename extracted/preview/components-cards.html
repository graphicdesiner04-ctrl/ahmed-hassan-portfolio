<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 28px; font-family: var(--font-family); }
  .grid { display: flex; gap: 20px; flex-wrap: wrap; }

  .card {
    background: var(--color-surface);
    overflow: hidden;
    transition: box-shadow 500ms cubic-bezier(0.25,0.1,0.25,1), transform 500ms cubic-bezier(0.25,0.1,0.25,1);
    flex: 1; min-width: 180px; max-width: 240px;
  }
  .card:hover { box-shadow: 0 8px 40px rgba(62,47,40,0.10); }
  .card-img {
    width: 100%; aspect-ratio: 4/3; overflow: hidden;
    background: var(--color-surface-alt);
    position: relative;
  }
  .card-img-inner {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #E8D9CC 0%, #D4C4B5 100%);
    transition: transform 600ms cubic-bezier(0.25,0.1,0.25,1);
    display: flex; align-items: center; justify-content: center;
  }
  .card:hover .card-img-inner { transform: scale(1.03); }
  .card-body { padding: 14px 16px 16px; }
  .card-label { font-size: 10px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 5px; }
  .card-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); line-height: 1.3; }
  .card-meta  { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }

  .placeholder-text { font-size: 11px; color: #C9A882; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; }

  /* Hover card — border variant */
  .card-border { border: 1px solid var(--color-border); }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="card-img"><div class="card-img-inner"><span class="placeholder-text">Project Image</span></div></div>
      <div class="card-body">
        <div class="card-label">Branding</div>
        <div class="card-title">Zahra Jewels</div>
        <div class="card-meta">Brand Identity, 2024</div>
      </div>
    </div>
    <div class="card card-border" style="background: var(--color-white);">
      <div class="card-img"><div class="card-img-inner" style="background:linear-gradient(135deg,#FDFAF7 0%,#EFE4DA 100%);"><span class="placeholder-text">Project Image</span></div></div>
      <div class="card-body">
        <div class="card-label">Social Media</div>
        <div class="card-title">Ramadan Campaign</div>
        <div class="card-meta">Social Campaign, 2024</div>
      </div>
    </div>
    <div class="card" style="background:#3E2F28;">
      <div class="card-img"><div class="card-img-inner" style="background:linear-gradient(135deg,#5C4A40 0%,#3E2F28 100%);"><span class="placeholder-text" style="color:#C9A882;">Project Image</span></div></div>
      <div class="card-body">
        <div class="card-label" style="color:#C9A882;">Print</div>
        <div class="card-title" style="color:#FDFAF7;">Noir Collection</div>
        <div class="card-meta" style="color:#7A6155;">Print Design, 2023</div>
      </div>
    </div>
  </div>
</body>
</html>
