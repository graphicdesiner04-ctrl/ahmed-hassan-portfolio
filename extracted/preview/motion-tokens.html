<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 28px 32px; font-family: var(--font-family); }
  .section { margin-bottom: 24px; }
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 14px; }
  .divider { height: 1px; background: var(--color-border-light); margin: 4px 0 24px; }

  .demo-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .demo-item { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .demo-label { font-size: 10px; color: var(--color-text-muted); font-family: monospace; }

  /* Hover animations */
  .hover-fade { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-secondary); cursor: pointer; transition: color 300ms cubic-bezier(0.25,0.1,0.25,1); }
  .hover-fade:hover { color: var(--color-text-primary); }

  .hover-underline { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-secondary); cursor: pointer; position: relative; display: inline-block; }
  .hover-underline::after { content: ''; position: absolute; left: 0; bottom: -2px; width: 0; height: 1px; background: var(--color-accent); transition: width 300ms cubic-bezier(0.25,0.1,0.25,1); }
  .hover-underline:hover::after { width: 100%; }

  .hover-card { background: var(--color-surface); padding: 16px 20px; font-size: 13px; font-weight: 500; color: var(--color-text-primary); cursor: pointer; transition: box-shadow 500ms cubic-bezier(0.25,0.1,0.25,1), transform 500ms cubic-bezier(0.25,0.1,0.25,1); }
  .hover-card:hover { box-shadow: 0 8px 40px rgba(62,47,40,0.10); transform: translateY(-2px); }

  .hover-btn { background: #3E2F28; color: #FDFAF7; padding: 10px 24px; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: background 300ms cubic-bezier(0.25,0.1,0.25,1); border: none; font-family: var(--font-family); }
  .hover-btn:hover { background: #1A1210; }

  .easing-tokens { display: flex; flex-direction: column; gap: 8px; }
  .easing-row { display: flex; gap: 16px; align-items: center; }
  .easing-name { font-size: 11px; font-weight: 500; min-width: 100px; color: var(--color-text-secondary); }
  .easing-val  { font-size: 10px; color: var(--color-text-muted); font-family: monospace; }
  .dur-tokens { display: flex; gap: 20px; }
  .dur-item { display: flex; flex-direction: column; gap: 3px; }
  .dur-name  { font-size: 10px; font-weight: 500; color: var(--color-text-secondary); letter-spacing: 0.08em; }
  .dur-val   { font-size: 10px; color: var(--color-text-muted); font-family: monospace; }
</style>
</head>
<body>
  <div class="section">
    <div class="section-label">Easing Curves</div>
    <div class="easing-tokens">
      <div class="easing-row"><span class="easing-name">smooth</span><span class="easing-val">cubic-bezier(0.25, 0.10, 0.25, 1)</span></div>
      <div class="easing-row"><span class="easing-name">ease-out</span><span class="easing-val">cubic-bezier(0.00, 0.00, 0.20, 1)</span></div>
    </div>
  </div>
  <div class="section">
    <div class="section-label">Durations</div>
    <div class="dur-tokens">
      <div class="dur-item"><span class="dur-name">Fast</span><span class="dur-val">200ms</span></div>
      <div class="dur-item"><span class="dur-name">Base</span><span class="dur-val">300ms</span></div>
      <div class="dur-item"><span class="dur-name">Slow</span><span class="dur-val">500ms</span></div>
      <div class="dur-item"><span class="dur-name">Reveal</span><span class="dur-val">700ms</span></div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="section" style="margin-bottom:0;">
    <div class="section-label">Live Hover States — hover each</div>
    <div class="demo-row">
      <div class="demo-item">
        <span class="hover-fade">Nav Link</span>
        <span class="demo-label">opacity / color fade</span>
      </div>
      <div class="demo-item">
        <span class="hover-underline">View Work</span>
        <span class="demo-label">underline slide-in</span>
      </div>
      <div class="demo-item">
        <div class="hover-card">Project Card</div>
        <span class="demo-label">shadow + Y lift</span>
      </div>
      <div class="demo-item">
        <button class="hover-btn">Get in Touch</button>
        <span class="demo-label">bg darken</span>
      </div>
    </div>
  </div>
</body>
</html>
