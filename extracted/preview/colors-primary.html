<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 24px; font-family: var(--font-family); }
  .swatches { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 80px; }
  .swatch-block { height: 72px; border: 1px solid rgba(62,47,40,0.08); }
  .swatch-name { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 8px; }
  .swatch-hex  { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; font-family: monospace; }
</style>
</head>
<body>
<div class="swatches">
  <div class="swatch"><div class="swatch-block" style="background:#F5EDE6;"></div><div class="swatch-name">BG</div><div class="swatch-hex">#F5EDE6</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#EFE4DA;"></div><div class="swatch-name">Surface</div><div class="swatch-hex">#EFE4DA</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#E8D9CC;"></div><div class="swatch-name">Surface Alt</div><div class="swatch-hex">#E8D9CC</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#FDFAF7; border: 1px solid #E8D9CC;"></div><div class="swatch-name">White</div><div class="swatch-hex">#FDFAF7</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#1A1210;"></div><div class="swatch-name">Black</div><div class="swatch-hex">#1A1210</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#C9A882;"></div><div class="swatch-name">Accent</div><div class="swatch-hex">#C9A882</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#9E7A54;"></div><div class="swatch-name">Accent Dark</div><div class="swatch-hex">#9E7A54</div></div>
</div>
</body>
</html>
