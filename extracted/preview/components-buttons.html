<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 28px 32px; font-family: var(--font-family); }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 10px; }
  .divider { height: 1px; background: var(--color-border-light); margin: 4px 0 20px; }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 28px;
    font-family: var(--font-family);
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    border: none; cursor: pointer;
    transition: all 300ms cubic-bezier(0.25, 0.10, 0.25, 1);
  }
  .btn-primary   { background: #3E2F28; color: #FDFAF7; }
  .btn-outline   { background: transparent; color: #3E2F28; border: 1px solid #3E2F28; }
  .btn-ghost     { background: transparent; color: #3E2F28; padding-left: 0; padding-right: 0; }
  .btn-accent    { background: #C9A882; color: #3E2F28; }
  .btn-disabled  { background: #E8D9CC; color: #B0998F; cursor: not-allowed; }

  .btn-sm { padding: 8px 20px; font-size: 11px; }
  .btn-lg { padding: 16px 40px; font-size: 13px; }

  .arrow { font-size: 14px; }
</style>
</head>
<body>
  <div class="label">Primary States</div>
  <div class="row">
    <button class="btn btn-primary">View Work <span class="arrow">→</span></button>
    <button class="btn btn-primary" style="background:#1A1210;">Hover State <span class="arrow">→</span></button>
    <button class="btn btn-primary" style="opacity:0.85;">Press State</button>
    <button class="btn btn-disabled" disabled>Disabled</button>
  </div>
  <div class="divider"></div>
  <div class="label">Variants</div>
  <div class="row">
    <button class="btn btn-outline">Get in Touch</button>
    <button class="btn btn-accent">View Project →</button>
    <button class="btn btn-ghost">See All Works →</button>
  </div>
  <div class="divider"></div>
  <div class="label">Sizes</div>
  <div class="row">
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-lg">Large</button>
  </div>
</body>
</html>
