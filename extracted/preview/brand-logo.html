<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 28px 32px; font-family: var(--font-family); }
  .section { margin-bottom: 28px; }
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 14px; }
  .logo-box { padding: 20px 24px; display: inline-block; }
  .logo-dark { background: #1A1210; }
  .logo-surface { background: var(--color-surface); }
  .wordmark {
    font-family: var(--font-family);
    font-weight: 300;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #3E2F28;
    font-size: 26px;
    line-height: 1;
  }
  .wordmark-rule { height: 0.5px; background: #C9A882; margin: 5px 0; }
  .wordmark-sub { font-size: 8px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #7A6155; }
  .wordmark-light { color: #FDFAF7; }
  .wordmark-sub-light { color: #C9A882; }
</style>
</head>
<body>
  <div class="section">
    <div class="section-label">Wordmark — Light Background</div>
    <div class="logo-box logo-surface">
      <div class="wordmark">Ahmed Hassan</div>
      <div class="wordmark-rule"></div>
      <div class="wordmark-sub">Creative Director · Visual Designer</div>
    </div>
  </div>
  <div class="section" style="margin-bottom:0;">
    <div class="section-label">Wordmark — Dark Background</div>
    <div class="logo-box logo-dark">
      <div class="wordmark wordmark-light">Ahmed Hassan</div>
      <div class="wordmark-rule" style="background:#C9A882;"></div>
      <div class="wordmark-sub wordmark-sub-light">Creative Director · Visual Designer</div>
    </div>
  </div>
</body>
</html>
