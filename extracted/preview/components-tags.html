<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 28px 32px; font-family: var(--font-family); }
  .section { margin-bottom: 22px; }
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .tag {
    display: inline-block;
    padding: 5px 14px;
    font-family: var(--font-family);
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    border-radius: 2px;
    cursor: pointer;
    transition: all 300ms cubic-bezier(0.25,0.1,0.25,1);
  }
  .tag-default  { background: transparent; color: #7A6155; border: 1px solid #E8D9CC; }
  .tag-active   { background: #3E2F28; color: #FDFAF7; border: 1px solid #3E2F28; }
  .tag-accent   { background: transparent; color: #9E7A54; border: 1px solid #C9A882; }
  .tag-muted    { background: var(--color-surface); color: #B0998F; border: 1px solid var(--color-border); }

  .dot-filter { display: flex; gap: 28px; align-items: center; }
  .dot-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #B0998F; }
  .dot.active { background: #3E2F28; }
  .dot-label { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #B0998F; }
  .dot-label.active { color: #3E2F28; }
</style>
</head>
<body>
  <div class="section">
    <div class="section-label">Category Filter Chips</div>
    <div class="row">
      <span class="tag tag-active">All</span>
      <span class="tag tag-default">Social</span>
      <span class="tag tag-default">Logo</span>
      <span class="tag tag-default">Branding</span>
      <span class="tag tag-default">Print</span>
    </div>
  </div>
  <div class="section">
    <div class="section-label">Tag Variants</div>
    <div class="row">
      <span class="tag tag-accent">Featured</span>
      <span class="tag tag-muted">2024</span>
      <span class="tag tag-default">Cairo</span>
    </div>
  </div>
  <div class="section" style="margin-bottom:0;">
    <div class="section-label">Dot Navigation (alternative filter)</div>
    <div class="dot-filter">
      <div class="dot-item"><div class="dot active"></div><span class="dot-label active">All</span></div>
      <div class="dot-item"><div class="dot"></div><span class="dot-label">Social</span></div>
      <div class="dot-item"><div class="dot"></div><span class="dot-label">Logo</span></div>
      <div class="dot-item"><div class="dot"></div><span class="dot-label">Branding</span></div>
      <div class="dot-item"><div class="dot"></div><span class="dot-label">Print</span></div>
    </div>
  </div>
</body>
</html>
