<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 24px; font-family: var(--font-family); }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .dot { width: 36px; height: 36px; flex-shrink: 0; border: 1px solid rgba(62,47,40,0.08); }
  .info { display: flex; flex-direction: column; gap: 1px; }
  .role { font-size: 12px; font-weight: 500; color: var(--color-text-primary); letter-spacing: 0.05em; }
  .desc { font-size: 11px; color: var(--color-text-muted); }
  .hex  { font-size: 11px; color: var(--color-text-muted); font-family: monospace; margin-left: auto; padding-right: 4px; }
</style>
</head>
<body>
<div class="rows">
  <div class="row"><div class="dot" style="background:#3E2F28;"></div><div class="info"><span class="role">Text Primary</span><span class="desc">Headlines, body copy</span></div><span class="hex">#3E2F28</span></div>
  <div class="row"><div class="dot" style="background:#7A6155;"></div><div class="info"><span class="role">Text Secondary</span><span class="desc">Captions, labels</span></div><span class="hex">#7A6155</span></div>
  <div class="row"><div class="dot" style="background:#B0998F;"></div><div class="info"><span class="role">Text Muted</span><span class="desc">Placeholders, meta</span></div><span class="hex">#B0998F</span></div>
  <div class="row"><div class="dot" style="background:#E8D9CC;"></div><div class="info"><span class="role">Border</span><span class="desc">Dividers, card edges</span></div><span class="hex">#E8D9CC</span></div>
  <div class="row"><div class="dot" style="background:#C9A882;"></div><div class="info"><span class="role">Accent</span><span class="desc">Active states, underlines, highlights</span></div><span class="hex">#C9A882</span></div>
</div>
</body>
</html>
