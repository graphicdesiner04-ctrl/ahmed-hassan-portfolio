<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Hassan — Portfolio</title>

<style>
@font-face {
  font-family: 'Alexandria';
  src: url('../../fonts/Alexandria-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body { background: #F5EDE6; font-family: 'Alexandria', 'Helvetica Neue', Arial, sans-serif; color: #3E2F28; }
button { font-family: 'Alexandria', sans-serif; }
input, textarea { font-family: 'Alexandria', sans-serif; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #F5EDE6; }
::-webkit-scrollbar-thumb { background: #C9A882; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="HeroSection.jsx"></script>
<script type="text/babel" src="ProjectGrid.jsx"></script>
<script type="text/babel" src="ProjectDetail.jsx"></script>
<script type="text/babel" src="AboutSection.jsx"></script>
<script type="text/babel" src="ContactSection.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
// ─── App Shell ────────────────────────────────────────────────────────────────
const App = () => {
  const [page, setPage] = React.useState('home');
  const [selectedProject, setSelectedProject] = React.useState(null);

  const navigate = (dest) => {
    setPage(dest);
    setSelectedProject(null);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const openProject = (project) => {
    setSelectedProject(project);
    setPage('project-detail');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // Determine nav page highlight
  const navPage = page === 'project-detail' ? 'work' : page === 'home' ? 'work' : page;

  return (
    <div>
      <Header currentPage={navPage} onNavigate={navigate} />

      {page === 'home' && (
        <>
          <HeroSection onNavigate={navigate} />
          {/* Featured projects strip */}
          <section style={{ background: '#EFE4DA', padding: '80px 48px' }}>
            <div style={{ maxWidth: '1184px', margin: '0 auto' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: '40px' }}>
                <h2 style={{ fontFamily: 'Alexandria, sans-serif', fontWeight: 300, fontSize: '32px', letterSpacing: '-0.01em', color: '#3E2F28' }}>
                  Featured Work
                </h2>
                <button onClick={() => navigate('projects')} style={{
                  fontFamily: 'Alexandria, sans-serif', background: 'none', border: 'none',
                  cursor: 'pointer', fontSize: '11px', fontWeight: 500, letterSpacing: '0.14em',
                  textTransform: 'uppercase', color: '#9E7A54', padding: 0,
                }}>
                  View All →
                </button>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '24px' }}>
                {(window.PROJECTS || []).slice(0, 3).map(project => {
                  const [hov, setHov] = React.useState(false);
                  return (
                    <div key={project.id}
                      onClick={() => openProject(project)}
                      onMouseEnter={() => setHov(true)}
                      onMouseLeave={() => setHov(false)}
                      style={{
                        cursor: 'pointer', overflow: 'hidden',
                        boxShadow: hov ? '0 8px 40px rgba(62,47,40,0.10)' : 'none',
                        transform: hov ? 'translateY(-2px)' : 'none',
                        transition: 'all 450ms cubic-bezier(0.25,0.1,0.25,1)',
                      }}
                    >
                      <div style={{ aspectRatio: '4/3', background: project.bg, overflow: 'hidden' }}>
                        <div style={{
                          width: '100%', height: '100%', background: project.bg,
                          transform: hov ? 'scale(1.04)' : 'scale(1)',
                          transition: 'transform 600ms cubic-bezier(0.25,0.1,0.25,1)',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                        }}>
                          <span style={{ fontFamily: 'Alexandria, sans-serif', fontSize: '10px', fontWeight: 500, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'rgba(253,250,247,0.4)' }}>{project.category}</span>
                        </div>
                      </div>
                      <div style={{ padding: '14px 0 4px', background: '#EFE4DA' }}>
                        <div style={{ fontFamily: 'Alexandria, sans-serif', fontSize: '15px', fontWeight: 500, color: '#3E2F28', marginBottom: '3px' }}>{project.title}</div>
                        <div style={{ fontFamily: 'Alexandria, sans-serif', fontSize: '11px', fontWeight: 500, letterSpacing: '0.12em', textTransform: 'uppercase', color: '#9E7A54' }}>{project.category}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </section>
          <AboutSection onNavigate={navigate} />
          <Footer onNavigate={navigate} />
        </>
      )}

      {page === 'projects' && (
        <>
          {/* Projects page header */}
          <div style={{ padding: '120px 48px 0', background: '#F5EDE6' }}>
            <div style={{ maxWidth: '1184px', margin: '0 auto', paddingBottom: '40px', borderBottom: '1px solid #E8D9CC' }}>
              <span style={{ fontFamily: 'Alexandria, sans-serif', fontSize: '11px', fontWeight: 500, letterSpacing: '0.18em', textTransform: 'uppercase', color: '#9E7A54', display: 'block', marginBottom: '12px' }}>Portfolio</span>
              <h1 style={{ fontFamily: 'Alexandria, sans-serif', fontWeight: 300, fontSize: 'clamp(40px, 5vw, 72px)', letterSpacing: '-0.02em', color: '#3E2F28', lineHeight: 1.06 }}>Selected Works</h1>
            </div>
          </div>
          <ProjectGrid onSelectProject={openProject} />
          <Footer onNavigate={navigate} />
        </>
      )}

      {page === 'project-detail' && selectedProject && (
        <>
          <ProjectDetail project={selectedProject} onBack={() => navigate('projects')} />
          <Footer onNavigate={navigate} />
        </>
      )}

      {page === 'about' && (
        <>
          <div style={{ paddingTop: '64px' }}>
            <AboutSection onNavigate={navigate} />
          </div>
          <Footer onNavigate={navigate} />
        </>
      )}

      {page === 'contact' && (
        <>
          {/* Contact page header */}
          <div style={{ padding: '120px 48px 64px', background: '#F5EDE6', borderBottom: '1px solid #E8D9CC' }}>
            <div style={{ maxWidth: '1184px', margin: '0 auto' }}>
              <span style={{ fontFamily: 'Alexandria, sans-serif', fontSize: '11px', fontWeight: 500, letterSpacing: '0.18em', textTransform: 'uppercase', color: '#9E7A54', display: 'block', marginBottom: '12px' }}>Contact</span>
              <h1 style={{ fontFamily: 'Alexandria, sans-serif', fontWeight: 300, fontSize: 'clamp(40px, 5vw, 72px)', letterSpacing: '-0.02em', color: '#3E2F28', lineHeight: 1.06 }}>Get in Touch</h1>
            </div>
          </div>
          <ContactSection />
          <Footer onNavigate={navigate} />
        </>
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
